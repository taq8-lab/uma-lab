<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06151b"><link rel="manifest" href="manifest.json">
<title>UMA LAB v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06151b;color:#f5f7f8;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:34px 20px 120px}.brand{font-size:30px;font-weight:900;letter-spacing:1px}.sub{color:#8198a2;font-size:16px;margin-top:2px}
.back{color:#00d99a;font-weight:800;margin:18px 0;cursor:pointer}.title{font-size:28px;font-weight:900;margin:24px 0}
.card{background:#0a2028;border:1px solid #214551;border-radius:22px;padding:20px;margin:14px 0}
.horse{font-size:23px;font-weight:900}.muted{color:#91a5ad}.green{color:#00d99a}.score{font-size:19px;font-weight:900}
.bar{height:8px;background:#173944;border-radius:8px;overflow:hidden;margin:7px 0 16px}.fill{height:100%;background:#00d99a}
.row{display:flex;justify-content:space-between;gap:12px}.race{border-top:1px solid #1c3a44;padding:16px 0}.race:first-child{border-top:0;padding-top:0}
.racehead{display:flex;justify-content:space-between;align-items:center}.place{font-weight:800}.finish{font-size:22px;font-weight:900}.meta{color:#a4b3b9;font-size:14px;margin:5px 0}
.passage{font-size:20px;font-weight:900;margin-top:8px}.note{color:#00d99a;font-size:14px;font-weight:800;margin-top:4px}.last3f{font-weight:800;margin-top:9px}
.badge{font-size:12px;border:1px solid #2e5a67;border-radius:999px;padding:4px 8px;color:#c7d3d7}
nav{position:fixed;bottom:0;left:0;right:0;background:#06151bf2;border-top:1px solid #214551;padding:13px 8px 22px;display:flex;justify-content:space-around;color:#8198a2}
nav span{font-size:13px}.active{color:#00d99a}
</style></head>
<body><main>
<div class="brand">♞ UMA LAB</div><div class="sub">データで競馬を科学する</div>
<div class="back">‹ 出走馬一覧</div>
<div class="title">3. ノーブルキング</div>
<div class="card"><div class="horse">C.ルメール</div><div class="muted">脚質　差し</div></div>
<div class="card">
<div class="score green">UMA LAB AI指数 91/100</div>
<div class="row"><span>距離適性</span><span>94</span></div><div class="bar"><div class="fill" style="width:94%"></div></div>
<div class="row"><span>コース適性</span><span>91</span></div><div class="bar"><div class="fill" style="width:91%"></div></div>
<div class="row"><span>展開適性</span><span>92</span></div><div class="bar"><div class="fill" style="width:92%"></div></div>
</div>
<div class="title" style="font-size:23px">直近5走</div>
<div class="card" id="history"></div>
<div class="card">
<div class="score green">AIレース内容分析</div>
<p style="line-height:1.65;margin-bottom:0">近走は中団〜後方からの競馬が中心。前走は <b>12-11-6-2</b> と3〜4角で大きく位置を上げ、上がり3Fもメンバー最速。<b>後方から長く脚を使って進出できるタイプ</b>として評価。</p>
</div>
</main>
<nav><span>⌂<br>ホーム</span><span class="active">♞<br>レース</span><span>✦<br>AI予想</span><span>▣<br>買い目</span><span>●<br>マイページ</span></nav>
<script>
const races=[
["前走","芝2000m・良","2着","12-11-6-2","後方から一気に進出","33.8秒","1位"],
["2走前","芝1800m・良","5着","10-10-9-7","後方から差を詰める","34.1秒","2位"],
["3走前","芝2000m・稍重","1着","7-7-5-2","中団から徐々に進出","34.5秒","3位"],
["4走前","芝2200m・良","3着","8-8-7-4","中団後方から進出","34.0秒","2位"],
["5走前","芝1800m・良","1着","4-4-3-1","好位から抜け出し","33.9秒","1位"]
];
document.getElementById("history").innerHTML=races.map(r=>`
<div class="race"><div class="racehead"><span class="place">${r[0]}　<span class="badge">${r[1]}</span></span><span class="finish">${r[2]}</span></div>
<div class="meta">通過順位</div><div class="passage">${r[3]}</div><div class="note">↗ ${r[4]}</div>
<div class="last3f">上がり3F　${r[5]} <span class="green">（${r[6]}）</span></div></div>`).join("");
</script></body></html>
