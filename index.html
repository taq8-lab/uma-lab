<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#06151b"><link rel="manifest" href="manifest.json?v=5">
<title>UMA LAB v5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06151b;color:#f4f7f8;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:30px 18px 120px}.brand{font-size:29px;font-weight:900}.sub,.muted{color:#8ca0a8}.green{color:#00d99a}
h1{font-size:27px}.card{background:#0a2028;border:1px solid #214551;border-radius:20px;padding:18px;margin:14px 0}
label{display:block;font-weight:800;margin:14px 0 7px}input,select{width:100%;background:#071920;color:white;border:1px solid #2b515d;border-radius:13px;padding:14px;font-size:17px}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.segment button{border:1px solid #2b515d;background:#0c2730;color:#a9bbc1;border-radius:12px;padding:11px 5px;font-weight:800}
.segment .on{background:#00d99a;color:#032119;border-color:#00d99a}.btn{width:100%;border:0;border-radius:15px;padding:15px;background:#00d99a;color:#032119;font-size:17px;font-weight:900;margin-top:17px}
.bet{border-top:1px solid #1d3c46;padding:15px 0}.bet:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:10px}.combo{font-size:20px;font-weight:900}.yen{font-size:20px;font-weight:900;color:#00d99a}.why{font-size:13px;color:#a9bbc1;margin-top:6px;line-height:1.5}
.total{font-size:22px;font-weight:900}.notice{font-size:12px;color:#71878f;line-height:1.5}.version{text-align:right;color:#58717a;font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:#06151bf2;border-top:1px solid #214551;padding:12px 7px 22px;display:flex;justify-content:space-around;color:#8198a2}nav span{font-size:12px;text-align:center}.active{color:#00d99a}
</style></head><body><main>
<div class="brand">♞ UMA LAB</div><div class="sub">データで競馬を科学する</div>
<h1>買い目作成</h1><div class="muted">中山11R・サンプル予想</div>

<div class="card">
<label>予算</label><input id="budget" type="number" min="100" step="100" value="5000">
<label>券種</label><select id="type"><option>馬連</option><option>ワイド</option><option>三連複</option></select>
<label>買い方</label><div class="segment">
<button onclick="mode('safe',this)">堅め</button><button class="on" onclick="mode('balance',this)">バランス</button><button onclick="mode('attack',this)">穴狙い</button>
</div>
<button class="btn" onclick="makeBets()">AIで買い目を作成</button>
</div>

<div class="card"><div class="row"><span class="total">AI推奨買い目</span><span id="total" class="total green"></span></div><div id="bets"></div></div>

<div class="card"><b class="green">配分の考え方</b><p id="comment" style="line-height:1.65;margin-bottom:0"></p></div>
<div class="notice">※ 現在は架空データを使った開発用デモです。オッズはまだ連携していないため、現段階の金額配分はAI指数・印を使ったサンプルです。</div>
<div class="version">UMA LAB v5</div>
</main>
<nav><span>⌂<br>ホーム</span><span>♞<br>レース</span><span>✦<br>AI予想</span><span class="active">▣<br>買い目</span><span>●<br>マイページ</span></nav>
<script>
let current="balance";
function mode(m,e){current=m;document.querySelectorAll(".segment button").forEach(x=>x.classList.remove("on"));e.classList.add("on");makeBets()}
function round100(x){return Math.max(100,Math.round(x/100)*100)}
function makeBets(){
 let b=Math.max(300,Number(document.getElementById("budget").value)||5000), t=document.getElementById("type").value;
 let data,weights,comment;
 if(t==="馬連") data=[["3-1","◎ノーブルキング－○アルファスター","本命と対抗を中心"],["3-5","◎ノーブルキング－▲グリーンアロー","末脚評価の2頭"],["3-8","◎ノーブルキング－☆ミッドナイトベル","穴候補との組み合わせ"]];
 else if(t==="ワイド") data=[["1-3","○－◎","中心2頭の安定型"],["3-5","◎－▲","差し性能を評価"],["3-8","◎－☆","穴馬の食い込みを狙う"]];
 else data=[["1-3-5","○－◎－▲","上位評価3頭"],["1-3-8","○－◎－☆","本命軸＋穴"],["3-5-8","◎－▲－☆","差し展開を強く想定"]];
 if(current==="safe"){weights=[.55,.30,.15];comment="本命・対抗を中心に厚く配分。的中を意識した構成。"}
 if(current==="balance"){weights=[.45,.33,.22];comment="上位評価を中心にしつつ、穴候補にも予算を残すバランス型。"}
 if(current==="attack"){weights=[.30,.30,.40];comment="穴候補を含む買い目への配分を増やし、リターンを狙う構成。"}
 let amounts=[round100(b*weights[0]),round100(b*weights[1])]; amounts.push(Math.max(100,b-amounts[0]-amounts[1]));
 let sum=amounts.reduce((a,c)=>a+c,0);
 document.getElementById("total").textContent=sum.toLocaleString()+"円";
 document.getElementById("bets").innerHTML=data.map((x,i)=>`<div class="bet"><div class="row"><span class="combo">${t} ${x[0]}</span><span class="yen">${amounts[i].toLocaleString()}円</span></div><div class="why">${x[1]}｜${x[2]}</div></div>`).join("");
 document.getElementById("comment").textContent=comment+" 実データ版ではオッズも加え、期待値を考慮した配分へ発展させます。";
}
makeBets();
</script></body></html>
